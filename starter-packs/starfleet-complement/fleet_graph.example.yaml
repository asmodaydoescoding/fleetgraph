# Fleet Graph — Starfleet Complement Example
#
# A working 75-node fleet topology built from Teknium's Hermes Star Trek
# profiles (https://github.com/teknium1/hermes-star-trek-profiles), organized
# into departments: Command, Sciences, Engineering, Security/Nightwatch,
# Medical & Counsel, Red Team (Illumination Directorate), and Legal/Ethics.
#
# Install profiles from that collection, preview this file, and apply it
# through Fleet Graph's reviewed graph-save flow.
#
# Rank structure:
#   rank 0 — High Command (4)      rank 2 — Senior Officers (33)
#   rank 1 — Department Heads (17)  rank 3 — Specialists (21)

